yuho-validate:
  image: python:3.12-slim
  stage: test
  variables:
    YUHO_VERSION: "5.1.0"
  before_script:
    - python -m pip install --disable-pip-version-check --no-input "yuho==${YUHO_VERSION}"
  script:
    - yuho ci-report . --format json -o report.json
  artifacts:
    paths:
      - report.json
    when: always
  rules:
    - changes:
        - "**/*.yh"
