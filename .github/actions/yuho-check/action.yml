name: 'Yuho Statute Check'
description: 'Validate Yuho (.yh) statute files'
inputs:
  directory:
    description: 'Directory to scan for .yh files'
    required: false
    default: '.'
  python-version:
    description: 'Python version'
    required: false
    default: '3.12'
  yuho-version:
    description: 'Exact released Yuho version to install'
    required: false
    default: '5.1.0'
  format:
    description: 'Output format (json or sarif)'
    required: false
    default: 'sarif'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash --noprofile --norc -euo pipefail {0}
      env:
        YUHO_VERSION: ${{ inputs.yuho-version }}
      run: |
        if [[ ! "$YUHO_VERSION" =~ ^[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
          echo "yuho-version must be an exact release version" >&2
          exit 2
        fi
        python -m pip install --disable-pip-version-check --no-input "yuho==$YUHO_VERSION"
    - shell: bash --noprofile --norc -euo pipefail {0}
      env:
        DIRECTORY: ${{ inputs.directory }}
        REPORT_FORMAT: ${{ inputs.format }}
      run: |
        case "$REPORT_FORMAT" in
          json|sarif) ;;
          *) echo "format must be json or sarif" >&2; exit 2 ;;
        esac
        yuho ci-report "$DIRECTORY" --format "$REPORT_FORMAT" \
          -o "yuho-results.$REPORT_FORMAT"
    - if: inputs.format == 'sarif' && always()
      uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
      with:
        sarif_file: yuho-results.sarif
