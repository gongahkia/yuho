name: Integration Tests

on:
  workflow_call:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  library-validation:
    name: Validate Library Statutes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-extras

      - name: Check all library statutes
        run: |
          failed=0
          for statute in library/penal_code/*/statute.yh; do
            echo "--- Checking $statute ---"
            if ! uv run --locked yuho check "$statute"; then
              failed=1
            fi
          done
          exit $failed

      - name: Check all example files
        run: |
          failed=0
          for example in examples/*.yh; do
            echo "--- Checking $example ---"
            if ! uv run --locked yuho check "$example"; then
              failed=1
            fi
          done
          exit $failed

      - name: Check all test statute files
        run: |
          failed=0
          for test_file in library/penal_code/*/test_statute.yh; do
            if [ -f "$test_file" ]; then
              echo "--- Checking $test_file ---"
              if ! uv run --locked yuho check "$test_file"; then
                failed=1
              fi
            fi
          done
          exit $failed

  cli-commands:
    name: CLI Command Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-extras

      - name: Version check
        run: uv run --locked yuho --version

      - name: AST command
        run: uv run --locked yuho ast examples/simple_statute.yh

      - name: Transpile to all text targets
        run: |
          mkdir -p /tmp/transpile-out
          for target in json english latex mermaid mindmap alloy docx akomantoso legalruleml; do
            echo "--- Transpiling to $target ---"
            uv run --locked yuho transpile library/penal_code/s415_cheating/statute.yh \
              --target "$target" \
              -o "/tmp/transpile-out/s415.$target"
          done
          echo "--- Files generated ---"
          ls -la /tmp/transpile-out/

      - name: Lint command
        run: uv run --locked yuho lint library/penal_code/s378_theft/statute.yh

      - name: Schema command
        run: uv run --locked yuho schema > /dev/null

      - name: Explain command
        run: |
          cat > /tmp/yuho-facts.json <<'JSON'
          {"taking": true, "intention": true, "possession": true, "consent": true, "movement": true}
          JSON
          uv run --locked yuho explain --facts /tmp/yuho-facts.json library/penal_code/s378_theft/statute.yh

  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-extras

      - name: Run property-based tests with extended examples
        run: uv run --locked pytest tests/test_properties.py tests/test_statutes.py -v --hypothesis-seed=0 -x

      - name: Run E2E test suite
        run: uv run --locked pytest tests/e2e/ -v -x

      - name: Run library statute tests
        run: uv run --locked pytest tests/test_library_statutes.py -v -x
