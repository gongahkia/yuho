name: Yuho CI/CD on Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8.4"
          cabal-version: "3.12"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: mechanisation
          build: true
          test: false
          lint: false
          use-github-cache: false
      - name: Install test-only schema validator
        run: python3 -m pip install 'jsonschema==4.25.1'
      - name: Restore Cabal cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cabal
          key: cabal-${{ runner.os }}-${{ hashFiles('cabal.project.freeze') }}
      - name: Build and verify
        run: make verify GHC=ghc-9.8.4
